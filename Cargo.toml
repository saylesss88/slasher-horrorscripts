[package]
name = "slasher-horrorscripts"
version = "0.3.0"
edition = "2024"
default-run = "slasher-horrorscripts"
authors = ["T.Sawyer <saylesss87@proton.me"]
repository = "https://github.com/saylesss88/slasher-horrorscripts"
description = "A Rust-based CLI tool that displays high-quality ANSI art of horror movie icons in your terminal"
readme = "README.md"
keywords = ["rust", "terminal"]
homepage = "https://github.com/saylesss88/slasher-horrorscripts"
categories = ["command-line-utilities"]
license = 'MIT'
exclude = [
	"result",
	"docs",
	".github",
	".gitignore",
	"assets/texts/*.txt",
	"assets/images/*.png",
]

[[bin]]
name = "slasher-horrorscripts"
path = "src/main.rs"

[[bin]]
name = "slasher"
path = "src/main.rs"

[dependencies]
px2ansi = {version = "0.3.11", features = ["full"]}
clap = {version = "4.4", default-features = false, features = ["derive", "std"]}
rand = "0.10.1"
rust-embed = "8.11.0"
anyhow = "1.0"
image = {version = "0.25.1", default-features = false, features = [
	"png",
	"jpeg",
]}
sysinfo = "0.39.1"
colored = "3.1.1"
ansi-width = "0.1.0"
libc = "0.2.186"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
